<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Moon 🌌 سوريا</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- مكتبة SimplePeer لتسهيل الصوت -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <style>
        :root {
            --primary: #00f2ff; --bg: #090919; --glass: rgba(255,255,255,0.07);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--bg); color: white; height: 100vh; overflow: hidden; }

        /* الفضاء */
        .stars { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a40 0%, #000 100%); z-index: -1; }
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: 0.3s; background: var(--bg); }
        .hidden { display: none !important; }

        /* تسجيل الدخول */
        .login-box { margin: auto; padding: 30px; background: var(--glass); border-radius: 20px; text-align: center; width: 90%; max-width: 380px; border: 1px solid rgba(255,255,255,0.1); }
        input { width: 100%; padding: 15px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 10px; color: white; text-align: center; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; margin-top: 10px; }

        /* التطبيق */
        .app-layout { display: flex; height: 100%; }
        .sidebar { width: 100%; max-width: 350px; background: rgba(10,10,20,0.95); border-left: 1px solid #333; display: flex; flex-direction: column; }
        .header { padding: 15px; height: 60px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        
        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-card { padding: 10px; margin-bottom: 5px; background: rgba(255,255,255,0.05); border-radius: 8px; display: flex; align-items: center; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; margin-left: 10px; border: 2px solid var(--primary); }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); position: relative; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 75%; font-size: 15px; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: var(--primary); color: #000; border-bottom-left-radius: 2px; }
        .msg.other { align-self: flex-start; background: #222; border-bottom-right-radius: 2px; }
        
        .input-bar { padding: 10px; background: rgba(0,0,0,0.8); display: flex; gap: 10px; }
        .mic-btn { color: #ff4081; cursor: pointer; font-size: 20px; padding: 10px; }
        .mic-active { animation: pulse 1s infinite; color: #00e676; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        /* للموبايل */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; z-index: 5; height: 100%; }
            .sidebar.minimized { display: none; }
            .back-btn { display: block !important; margin-left: 10px; }
        }
        .back-btn { display: none; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <!-- تسجيل الدخول -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1 style="color:var(--primary); margin:0 0 20px;">Chat Moon</h1>
            <p style="color:#aaa;">سيرفر خاص - يعمل في سوريا</p>
            <input type="text" id="username" placeholder="اسمك المستعار">
            <div style="position:relative;">
                <span style="position:absolute; left:15px; top:15px; color:var(--primary); font-weight:bold;">+963</span>
                <input type="tel" id="phone" placeholder="9xx xxx xxx" style="direction:ltr; padding-left:60px; font-weight:bold;">
            </div>
            <button class="btn" onclick="joinChat()">دخول</button>
        </div>
    </div>

    <!-- التطبيق -->
    <div id="app-screen" class="screen hidden">
        <div class="app-layout">
            <div id="sidebar" class="sidebar">
                <div class="header">
                    <div style="font-weight:bold;" id="my-name-display">أنا</div>
                    <i class="fas fa-sign-out-alt" style="color:#ff5252; cursor:pointer;" onclick="location.reload()"></i>
                </div>
                <div id="users-list" class="user-list"></div>
            </div>

            <div class="chat-area">
                <div class="header" style="background:rgba(0,0,0,0.5);">
                    <i class="fas fa-arrow-right back-btn" onclick="toggleSidebar()"></i>
                    <div style="flex:1; font-weight:bold;">الغرفة العامة 🚀</div>
                    <div class="mic-btn" id="voice-btn" onclick="toggleVoice()"><i class="fas fa-microphone"></i> صوت</div>
                </div>
                
                <div id="msgs-area" class="messages"></div>
                
                <div class="input-bar">
                    <input type="text" id="msg-input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button class="btn" style="width:auto; margin:0; padding:10px 20px;" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Elements for Voice Chat -->
    <div id="audio-container"></div>

    <script>
        const socket = io();
        let myData = {};
        let peers = {}; // لتخزين اتصالات الصوت
        let stream = null; // المايكروفون الخاص بي

        function joinChat() {
            const name = document.getElementById('username').value;
            let phone = document.getElementById('phone').value;
            
            if(!name) return alert("الاسم مطلوب");
            phone = phone.replace(/\D/g, '').replace(/^0+/, '');
            if(phone.length < 8) return alert("الرقم قصير");

            myData = { name, phone: "+963 " + phone };
            
            // محاكاة كود التحقق
            const code = Math.floor(1000 + Math.random() * 9000);
            alert(`كود التحقق الخاص بك هو: ${code}`);
            const input = prompt("أدخل الكود الذي ظهر لك:");
            
            if(input == code) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('my-name-display').innerText = name;
                
                // إرسال البيانات للسيرفر
                socket.emit('join', myData);
                
                // للموبايل: إخفاء القائمة عند البدء
                if(window.innerWidth < 768) toggleSidebar();
            } else {
                alert("كود خاطئ");
            }
        }

        // --- إدارة الرسائل والمستخدمين ---
        socket.on('init-data', (data) => {
            document.getElementById('users-list').innerHTML = '';
            Object.values(data.users).forEach(u => addUserToList(u));
            data.messages.forEach(m => addMessage(m));
        });

        socket.on('user-joined', (u) => {
            addUserToList(u.data);
            addSystemMsg(`${u.data.name} انضم للمحادثة`);
        });

        socket.on('new-message', (msg) => addMessage(msg));
        
        socket.on('user-left', (id) => {
            // تحديث القائمة (بشكل بسيط سنعيد تحميلها لاحقاً، حالياً إشعار فقط)
            // addSystemMsg("مستخدم غادر");
        });

        function addUserToList(user) {
            const list = document.getElementById('users-list');
            const div = document.createElement('div');
            div.className = 'user-card';
            div.innerHTML = `
                <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
                <div style="margin-right:10px;">
                    <div style="font-weight:bold;">${user.name}</div>
                    <div style="font-size:11px; color:#aaa;">${user.phone}</div>
                </div>
            `;
            list.appendChild(div);
        }

        function sendMsg() {
            const txt = document.getElementById('msg-input').value;
            if(!txt) return;
            socket.emit('send-message', { text: txt, name: myData.name });
            document.getElementById('msg-input').value = '';
        }

        function addMessage(msg) {
            const area = document.getElementById('msgs-area');
            const isMe = msg.name === myData.name;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'me' : 'other'}`;
            div.innerHTML = `
                <div style="font-size:10px; opacity:0.7; margin-bottom:2px;">${msg.name}</div>
                ${msg.text}
            `;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function addSystemMsg(txt) {
            const area = document.getElementById('msgs-area');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '12px';
            div.style.color = '#aaa';
            div.style.margin = '10px 0';
            div.innerText = txt;
            area.appendChild(div);
        }

        // --- نظام الصوت (Mesh WebRTC) ---
        async function toggleVoice() {
            const btn = document.getElementById('voice-btn');
            
            if(stream) {
                // إيقاف الصوت
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                btn.classList.remove('mic-active');
                btn.innerHTML = '<i class="fas fa-microphone"></i> صوت';
                // قطع الاتصال
                Object.values(peers).forEach(p => p.destroy());
                peers = {};
            } else {
                // تشغيل الصوت
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    btn.classList.add('mic-active');
                    btn.innerHTML = '<i class="fas fa-microphone"></i> متصل';
                    
                    // الاتصال بالآخرين (إرسال إشارة أنني دخلت)
                    // ملاحظة: في هذا التطبيق البسيط، نحن نعتمد على انضمام الآخرين
                    // لتفعيل الصوت بالكامل يجب أن يكون هناك تبادل إشارات معقد
                    // لكن للتبسيط: عند الضغط، نحن مستعدون لاستقبال إشارات
                    
                } catch(e) {
                    alert("لا يمكن الوصول للمايكروفون: " + e.message);
                }
            }
        }

        // استقبال إشارات الصوت (P2P)
        socket.on('voice-signal', ({ signal, callerID }) => {
            const peer = addPeer(signal, callerID);
            peer.signal(signal);
        });

        function addPeer(incomingSignal, callerID) {
            const peer = new SimplePeer({
                initiator: false,
                stream: stream,
                trickle: false
            });

            peer.on('signal', signal => {
                socket.emit('voice-signal', { signal, target: callerID });
            });

            peer.on('stream', userStream => {
                const audio = document.createElement('audio');
                audio.srcObject = userStream;
                audio.play();
                document.getElementById('audio-container').appendChild(audio);
            });

            peers[callerID] = peer;
            return peer;
        }

        // واجهة الموبايل
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            if(sb.style.display === 'none') {
                sb.style.display = 'flex';
            } else {
                sb.style.display = 'none';
            }
        }
    </script>
</body>
</html>
